[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runbook-rag-starter"
version = "0.1.0"
description = "The smallest useful RAG over a folder of Markdown runbooks — companion to the 'What is RAG?' primer on cloudandsre.com."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["rag", "sre", "runbook", "ai", "llm", "sqlite-vec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "sqlite-vec>=0.1.6",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
runbook-rag = "runbook_rag.cli:main"

[project.urls]
Homepage = "https://cloudandsre.com/blog/what-is-retrieval-augmented-generation/"
Repository = "https://github.com/ajinb/runbook-rag-starter"
Issues = "https://github.com/ajinb/runbook-rag-starter/issues"

[tool.hatch.build.targets.wheel]
packages = ["runbook_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
